# CJKFolio 相依宣告與授權錨點。
#
# 本檔的第二個用途和第一個一樣重要：讓授權盤點有錨點。
# THIRD-PARTY-LICENSES.md 的授權事實是對「某一組版本」成立的，沒有版本宣告
# 就沒有可複查的對象。PyMuPDF 在 1.24.x 之前是 GPL v3 而非 AGPL v3，
# 升版可能改變整個專案的授權結論，所以每個相依都在下方註記了授權。
#
# 注意：本專案的支援形態是自 repo 根執行（python -m cjkfolio.cli ...）。
# 安裝形態兩輪實測：Sprint 119（Spike 21）wheel 建得出、venv 內 repo 外跑得完 CLI
# （字型須以 --font-dir 明給）；Sprint 121（Spike 23）sdist 建得出且裝得起來、乾淨 venv
# 不帶 --no-deps 相依全部解析成功（單機單 Python 版本）。PyPI 未上架（對外發布待 Owner），
# 故仍無 pip 安裝管道。實測數據見 spikes/spike21-packaging/ 與 spikes/spike23-sdist-deps/。

[project]
name = "cjkfolio"
# 版本策略（Sprint 119 定案）：恆等於 CHANGELOG 最新一則的版本號，測試釘死。
version = "0.127.0"
description = "CJK 直排書冊排版編輯器：出版級直排引擎與自寫 PDF/X 輸出"
license = "AGPL-3.0-or-later"
authors = [{ name = "黃政文" }]

# 只驗證過 Python 3.12.10。未在其他版本上跑過測試，故不宣稱相容。
requires-python = ">=3.12"

dependencies = [
    "PyMuPDF>=1.27.2",   # AGPL-3.0 or Artifex Commercial。決定本專案授權的那一個。
    "PySide6>=6.11.0",   # LGPL-3.0-only OR GPL-2.0-only OR GPL-3.0-only（本專案取 GPL-3.0-only 臂）
    "pillow>=12.2.0",    # MIT-CMU
    "fonttools>=4.62.1", # MIT
    "freetype-py>=2.5.1",# BSD-3-Clause；夾帶的 libfreetype.dll 為 FreeType 2.13.2，取 FTL 臂（見 THIRD-PARTY-LICENSES.md）
    "uharfbuzz>=0.55.0", # Apache-2.0
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.2",       # MIT
    "python-docx>=1.2.0",  # MIT，僅測試中的獨立驗證路徑使用
    "packaging>=26.0",     # Apache-2.0 OR BSD-2-Clause，tools/audit_licenses.py 用其 marker 求值
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

# 扁平佈局（cjkfolio/ 與 editor/、tools/、tests/、spikes/ 平行），setuptools 的
# 自動發現看到多個頂層目錄會拒絕猜測，所以套件清單一律顯式列出。
# editor/ 不入清單：它不是套件（無 __init__.py，app.py 自行 sys.path.insert）。
# templates/ 留在 repo 根（模版是專案交付物，不是躲在套件裡的實作細節），
# 靠 package-dir 映射進 wheel 的 cjkfolio/templates/。
[tool.setuptools]
packages = ["cjkfolio", "cjkfolio.templates"]

[tool.setuptools.package-dir]
"cjkfolio.templates" = "templates"

[tool.setuptools.package-data]
"cjkfolio.templates" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests", "spikes"]
